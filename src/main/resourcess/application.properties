# Fixes the SerializationException by allowing Java objects to be sent as JSON
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Required by Task 6 of the JPMC instructions
general.kafka-topic=trader-updates

# (Optional) Ensures the H2 database is ready for JPA tasks
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect